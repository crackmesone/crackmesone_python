<!DOCTYPE html>
<html>

<head>
    <title>Manage Comments</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/spectre.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/spectre-exp.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/spectre-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>

<body>
    <header class="navbar hide-xs">
        <section class="navbar-section">
            <h2><a href="{{ url_for('reviewer.dashboard') }}" class="title-navbar">Dashboard</a></h2>
        </section>
        <section class="navbar-center">
            <h2>Welcome, {{ user }}!{% if is_admin %} (Admin){% endif %}</h2>
        </section>
        <section class="navbar-section">
            <a href="{{ url_for('reviewer.logout') }}" class="btn btn-link">Logout</a>
        </section>
    </header>

    <div class="container grid-lg wrapper">
        {% if error %}
        <div class="text-center notif-item s-rounded">
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form class="form-horizontal" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="action" value="load">
            <div class="form-group">
                <div class="col-3">Crackme UUID</div>
                <div class="col-9 col-sm-12">
                    <input class="form-input" type="text" id="name" name="crackme_uuid" placeholder="UUID" value="{{ crackme_uuid or '' }}">
                </div>
            </div>
            <input type="submit" class="btn active float-right" value="Load comments">
        </form>

        {% if comments %}
        <table class="table table-striped table-scroll">
            <thead>
                <tr style="text-align: center;">
                    <th style="width: 15%;">Author</th>
                    <th style="width: 50%;">Comment</th>
                    <th style="width: 15%;">Spoiler</th>
                    <th style="width: 20%;">Actions</th>
                </tr>
            </thead>
            <tbody id="content-list">
                {% for comment in comments %}
                <tr class="text-center">
                    <td> <span style="white-space: pre-line">{{comment.author}}</span></td>
                    <td> <span style="white-space: pre-line">{{comment.content}}</span></td>
                    <td>
                        <form method="post" style="display: inline;">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <input type="hidden" name="action" value="toggle_spoiler">
                            <input type="hidden" name="comment_uuid" value="{{comment.comment_uuid}}">
                            <input type="hidden" name="crackme_uuid" value="{{crackme_uuid}}">
                            <button type="submit" class="btn btn-sm {{ 'btn-warning' if comment.spoiler else 'btn-primary' }}">
                                {{ 'Yes' if comment.spoiler else 'No' }}
                            </button>
                        </form>
                    </td>
                    <td>
                        <form method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this comment?');">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <input type="hidden" name="action" value="delete">
                            <input type="hidden" name="comment_uuid" value="{{comment.comment_uuid}}">
                            <input type="hidden" name="crackme_uuid" value="{{crackme_uuid}}">
                            <button type="submit" class="btn btn-sm btn-error">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% endif %}
    </div>
</body>

</html>
